<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Login</title>

    <link rel="stylesheet" href="/static/css/login.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<div class="background">

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

</div>

<div class="container">

    <div class="left-panel">

        <h1>Marketplace</h1>

        <p>
            The next generation multi-vendor platform
            for buyers, sellers and businesses.
        </p>

        <div class="floating-card">
            🚀 Secure Shopping
        </div>

        <div class="floating-card">
            ⭐ Premium Products
        </div>

        <div class="floating-card">
            💎 Best Deals Daily
        </div>

    </div>

    <div class="login-box">

        <h2>Welcome Back</h2>

        <p>Login to continue shopping</p>

        <form id="loginForm">

            <div class="input-group">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

            </div>

            <div class="input-group">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <div class="show-password">

                    <input
                        type="checkbox"
                        id="showPassword"
                    >

                    <label for="showPassword">
                        Show Password
                    </label>

                </div>

            </div>

            <div class="options">

                <label>

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember Me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <p id="loginMessage"></p>

            <button
                type="submit"
                id="loginBtn"
            >
                Login
            </button>

        </form>

        <div class="social-login">

            <button
                type="button"
                class="google"
                id="googleLogin"
            >
                Google
            </button>

            <button
                type="button"
                class="github"
                id="githubLogin"
            >
                GitHub
            </button>

        </div>

        <div class="register-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>

    </div>

</div>

<script src="/static/js/login.js"></script>

</body>
</html>
