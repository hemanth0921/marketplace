<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard</title>

    <link rel="stylesheet" href="/static/css/vendor_dashboard.css">
</head>

<body>

<div class="vendor-dashboard">

    <aside class="sidebar">

        <div class="logo">
            <h2>VendorHub</h2>
        </div>

        <a href="javascript:void(0)" onclick="showDashboard()">📊 Dashboard</a>

        <a href="javascript:void(0)" onclick="loadProducts()">📦 Products</a>

        <a href="javascript:void(0)" onclick="loadOrders()">🛒 Orders</a>

        <a href="javascript:void(0)" onclick="loadRevenue()">💰 Revenue</a>

        <a href="javascript:void(0)" onclick="loadReviews()">⭐ Reviews</a>

        <a href="javascript:void(0)" onclick="loadSettings()">⚙️ Settings</a>

    </aside>

    <main class="main-content">

        <div class="header">
            <h1>Vendor Dashboard</h1>

            <!-- UPDATED BUTTON -->
            <button class="add-btn" onclick="openAddProductForm()">
                + Add Product
            </button>
        </div>

        <div id="content-area">

            <div class="stats-grid">

                <div class="stat-card">
                    <h3>Total Sales</h3>
                    <h2>₹2,45,000</h2>
                </div>

                <div class="stat-card">
                    <h3>Orders</h3>
                    <h2>1,258</h2>
                </div>

                <div class="stat-card">
                    <h3>Products</h3>
                    <h2>342</h2>
                </div>

                <div class="stat-card">
                    <h3>Customers</h3>
                    <h2>4,892</h2>
                </div>

            </div>

            <div class="products-section">

                <h2>Top Products</h2>

                <div class="product-card">
                    <span>📱 iPhone 16 Pro</span>
                    <strong>₹1,29,999</strong>
                </div>

                <div class="product-card">
                    <span>💻 Gaming Laptop</span>
                    <strong>₹89,999</strong>
                </div>

                <div class="product-card">
                    <span>⌚ Smart Watch</span>
                    <strong>₹19,999</strong>
                </div>

            </div>

        </div>

    </main>

</div>

<script src="/static/js/vendor_manage.js"></script>

<script>
function openAddProductForm() {
    window.location.href = "/add-product";
}
</script>

</body>
</html>
