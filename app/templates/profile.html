<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<link rel="stylesheet" href="/static/css/profile.css">

        </div>

        <div class="details">

            <div class="item">
                📧 hemanth@gmail.com
            </div>

            <div class="item">
                📱 +91 9876543210
            </div>

            <div class="item">
                📍 Hyderabad
            </div>

            <div class="item">
                📅 Joined 2026
            </div>

</div>

<script src="/static/js/profile.js"></script>
