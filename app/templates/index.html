<!DOCTYPE html>
<html>
<head>
    <title>Marketplace</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI;
        }

        body{
            background:#f5f5f5;
        }

        nav{
            background:#111827;
            color:white;
            padding:20px 50px;

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            color:#4ade80;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:20px;
        }

        .hero{
            height:80vh;

            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;

            background:linear-gradient(
            135deg,
            #1e3c72,
            #2a5298
            );

            color:white;
        }

        .hero h1{
            font-size:55px;
        }

        .hero p{
            margin-top:15px;
            font-size:20px;
        }

        .hero button{
            margin-top:25px;
            padding:15px 30px;
            border:none;
            border-radius:10px;
            background:#22c55e;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        .products{
            padding:50px;
        }

        .cards{
            display:flex;
            gap:20px;
        }

        .card{
            background:white;
            width:250px;
            padding:20px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        .card img{
            width:100%;
        }

    </style>

</head>
<body>

<nav>
    <div class="logo">MarketPlace</div>

    <div>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </div>
</nav>

<section class="hero">

    <h1>Multi Vendor Marketplace</h1>

    <p>Buy and Sell Products Easily</p>

    <button>Shop Now</button>

</section>

<section class="products">

<h2>Trending Products</h2>

<br>

<div class="cards">

<div class="card">
    <h3>Mobile</h3>
    <p>₹15,000</p>
</div>

<div class="card">
    <h3>Laptop</h3>
    <p>₹45,000</p>
</div>

<div class="card">
    <h3>Headphones</h3>
    <p>₹2,000</p>
</div>

</div>

</section>

</body>
</html>
